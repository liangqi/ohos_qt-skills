# knowledge/adaptation/modules.yaml — Qt module availability matrix (machine-readable)
#
# Single source of truth: semantic/qt-harmonyos-modules.md + semantic/qt-harmonyos-qt6-status.md
# This file is their machine projection, consumed by qt-ohos-run.py assess / plan; keep it in sync with the human pages when editing.
# Module names are always lowercase without the version prefix (the scanner's output convention: core/gui/widgets/...).
#
# status values:
#   available    — built into the SDK, usable directly
#   self-compile — not in the SDK, must be cross-compiled yourself (not necessarily a blocker)
#   out-of-scope — unsupported on the platform (a blocker if it's a core dependency)
#   restricted   — partially supported/limited capability, verify item by item
#
# Baseline: Qt 5.12.12 (tqtc/harmonyos-5.12.12, 613336de) / Qt 5.15.16 (962aa625)
#       Qt 6.12.0 prebuilt installer (re-checked 2026-07-25)

schema: 1
updated: 2026-09-08
source: semantic/qt-harmonyos-modules.md

versions:
  qt5_12: "5.12.12"
  qt5_15: "5.15.16"
  qt6_12: "6.12.0"

modules:
  core:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  gui:
    qt5_12: available
    qt5_15: available
    qt6_12: available

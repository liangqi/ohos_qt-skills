    qt5_12: available
    qt5_15: available
    qt6_12: available
  openglextensions:
    qt5_12: restricted
    qt5_15: restricted
    qt6_12: restricted
    note: "In most distributions a static/header-only module with no standalone .so (tested 2026-09-09: neither Qt-full 5.15.16 nor Qt6 beta3 has libQt*OpenGLExtensions.so)"
    ref: semantic/qt-harmonyos-modules.md
  printsupport:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  svg:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  qml:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quick:

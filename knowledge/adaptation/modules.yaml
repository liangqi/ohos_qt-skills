    qt5_15: available
    qt6_12: available
  quickwidgets:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quickcontrols2:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  quicktest:
    qt5_12: available
    qt5_15: available
    qt6_12: available
  ohosextras:
    qt5_12: available
    qt5_15: available
    qt6_12: restricted
    note: "In Qt6 it is split out again as HarmonyExtras; the public headers are only exports/version stubs, and the functional headers are private _p.h"
    ref: semantic/qt-ohos-extras.md
  docgallery:
    qt5_12: available
    qt5_15: out-of-scope
    qt6_12: out-of-scope
  uitools:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "The qttools dependency can only be built natively on a HarmonyOS PC (host build); cross-compiling on Windows isn't feasible"
    ref: problems/build-missing-qt5uitools-ohos.md
  help:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "For Qt5, like uitools, it needs a native build on a HarmonyOS PC; Qt6 beta3 tested to include libQt6Help.so (2026-09-09)"
    ref: problems/build-missing-qt5uitools-ohos.md
  multimedia:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    note: "Not in the official Qt5 SDK (modules page); a Qt-full complete build tested to include libQt5Multimedia.so; Qt6 beta3 tested to include it"
    ref: semantic/qt-harmonyos-modules.md
  multimediawidgets:
    qt5_12: self-compile
    qt5_15: self-compile
    qt6_12: available
    ref: semantic/qt-harmonyos-modules.md
  pdf:

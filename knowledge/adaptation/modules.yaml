  webview:
    qt5_12: restricted
    qt5_15: restricted
    qt6_12: out-of-scope
    note: "A Qt-full complete build tested to include libQt5WebView.so; status in the official SDK to be confirmed. Use a native bridge for lightweight display; use CEF for a full engine"
    ref: procedural/qt-cef-ohos-dev-guide.md
  dbus:
    qt5_12: out-of-scope
    qt5_15: out-of-scope
    qt6_12: out-of-scope

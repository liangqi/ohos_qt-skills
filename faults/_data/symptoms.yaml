# faults/_data/symptoms.yaml — source of truth for symptoms (S)
#
# Entity: symptom = application-layer behavior a developer can observe (the lookup entry; a thin record).
# Field spec in faults/_index.md §5; this file is the single source of truth;
# _graph.yaml / _registry.md are rebuilt by `python tools/faults-build.py build` -- don't edit the derived artifacts by hand.
#
# Fields:
#   id          S-XXXX (append-only, never reused)
#   title       the symptom in one sentence (lookup anchor; use the words a developer would say)
#   domain      build/deploy/runtime/render/api/input/lifecycle/toolchain/filesystem
#   severity    blocker/critical/high/medium/low
#   status      active (still hit when no workaround is applied) / mitigated (gone with the workaround) / resolved (gone after the root cause is fixed)
#   causes      cause edges (S→C); with multiple causes, set cause_relation
#   cause_relation  any_of (default: removing any one cause makes the symptom go away) / all_of (the causes only combine to produce it)
#   first_seen  date first seen
#   refs        ids of related knowledge pages


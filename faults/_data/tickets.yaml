# faults/_data/tickets.yaml — source of truth for upstream tracking tickets (T)
#
# Entity: tracking ticket = an issue filed upstream (Qt bug tracker / HarmonyOS issue / Gitee / partner deliverable).
# One cause can have several T (one on the Qt side + one on the Huawei side); a T's fix_version is the authoritative source for the "fix version".
#
# Fields:
#   id          T-XXXX (append-only, never reused)
#   tracker     qt-bug / ohos-issue / gitee / partner (partner deliverable) / forum
#   number      ticket number (QTBUG-xxxxxx / Huawei issue number, etc.; may be empty for deliverables)
#   url         ticket link
#   tracks      the causes it tracks (T→C edges)
#   status      draft (draft) → submitted (filed) → accepted (accepted) → fixed (merged)
#               → released (shipped in a release; fix_version required) → closed;
#               branches: dup (duplicate) / wontfix (rejected)
#   filed       filing date (leave empty if not recorded)
#   fix_version fix version (e.g. "Qt 6.12-beta4", "API 25"; required from released on)
#   fix_commit  fix commit (optional)
#   planned_filing planned filing date (draft only): setting it marks the ticket as "scheduled";
#              the chain still counts as not closed, but check reports INFO instead of WARN (someone owns it)
#   last_update date of the latest progress (optional)
#   notes       notes (nature of the ticket, summary of replies, etc.)

